server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API lives in the same origin so no CORS is needed. No trailing slash on proxy_pass:
    # with one, nginx strips the /api/ prefix and every route 404s.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Hashed assets are immutable; index.html is served without no-store so the page stays
    # eligible for the back/forward cache (the app validates its own state on pageshow).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
